    Experience:
      - company: Calici Co., Ltd.
        position: AI Team Lead
        location: Daejeon, South Korea
        start_date: 2021-07
        end_date: Present
        summary: >
          Joined as the company's first employee and now lead the AI team, working across
          internal platform development and research collaborations with universities,
          institutes and pharmaceutical companies in Korea and abroad.
        highlights:
          - Built and benchmarked molecular property and ADMET prediction models, including a multitask model now in production.
          - First author of CaliciBoost (<i>Journal of Cheminformatics</i>, 2025), ranked first on the TDC Caco-2 permeability leaderboard.
          - Carried out structure-based modelling — docking, molecular dynamics and MM/PBSA — for collaborative studies, including a 2026 <i>PNAS</i> paper on hepatitis E virus replication.
          - Co-inventor on three US patents covering GPU-based drug discovery systems.
          - Lead computational design campaigns for peptide and antibody therapeutics, and represent the company in national research consortia.

      - company: Appen
