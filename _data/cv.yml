cv:
  name: Huong (Christine) Van Le
  label: AI Team Lead, Calici Co., Ltd.
  email: huongvanle.ust@gmail.com
  location: Daejeon, South Korea
  image: ""
  summary: >
    I lead the AI team at Calici Co., Ltd., working at the intersection of machine learning and
    computational drug discovery. My research covers molecular property and ADMET prediction under
    limited data, structure-based modelling of biomolecular complexes, and the computational design
    of peptide and antibody therapeutics. I am preparing to pursue doctoral research in this field.

